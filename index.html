<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nutrition Tracker v5.0 (Fail-Safe)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #22c55e;
            --secondary-green: #dcfce7;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --bg-gray: #f3f4f6;
            --white: #ffffff;
            --caution: #eab308;
            --avoid: #ef4444;
            --blue: #3b82f6;
            --orange: #f97316;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: #e5e5e5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        /* Mobile Container */
        .app-container {
            width: 100%; max-width: 390px; height: 100vh; max-height: 844px;
            background-color: var(--bg-gray); border-radius: 0; overflow: hidden;
            position: relative; display: flex; flex-direction: column;
        }
        @media (min-width: 400px) { .app-container { height: 844px; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); } }

        /* UI Styles */
        header { padding: 40px 20px 10px 20px; background: var(--bg-gray); z-index: 10; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-title { font-size: 24px; font-weight: 700; color: var(--text-dark); }
        .content { flex: 1; overflow-y: auto; padding: 0 20px 100px 20px; scrollbar-width: none; } .content::-webkit-scrollbar { display: none; }
        .card { background: var(--white); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .stats-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stat-item { text-align: center; } .stat-val { font-size: 18px; font-weight: 700; } .stat-label { font-size: 10px; color: var(--text-gray); text-transform: uppercase; }
        .circle-progress { width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(var(--primary-green) 0% 78%, #e5e7eb 78% 100%); display: flex; justify-content: center; align-items: center; position: relative; }
        .circle-inner { width: 120px; height: 120px; background: var(--bg-gray); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .percentage { font-size: 32px; font-weight: 800; color: var(--text-dark); } .clean-label { font-size: 14px; color: var(--text-gray); font-weight: 600; }
        .insight-card { background: var(--secondary-green); padding: 15px; border-radius: 16px; display: flex; align-items: flex-start; gap: 15px; margin-bottom: 20px; }
        .insight-icon { font-size: 20px; color: var(--primary-green); }
        .insight-text h4 { font-size: 14px; margin-bottom: 4px; color: var(--text-dark); } .insight-text p { font-size: 12px; color: var(--text-gray); line-height: 1.4; }
        .macro-row { margin-bottom: 12px; } .macro-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; font-weight: 600;}
        .macro-bar-bg { width: 100%; height: 6px; background: #e5e7eb; border-radius: 10px; overflow: hidden; } .macro-bar-fill { height: 100%; border-radius: 10px; }
        .bg-blue { background-color: var(--blue); } .bg-orange { background-color: var(--orange); } 
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .scan-item { display: flex; align-items: center; background: var(--white); padding: 12px; border-radius: 16px; margin-bottom: 10px; }
        .scan-img { width: 45px; height: 45px; border-radius: 8px; background: #ddd; object-fit: cover; margin-right: 12px; }
        .scan-info { flex: 1; } .scan-name { font-size: 14px; font-weight: 600; color: var(--text-dark); margin-bottom: 2px;} .scan-time { font-size: 11px; color: var(--text-gray); }
        .scan-badge { font-size: 10px; padding: 4px 8px; border-radius: 12px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
        .badge-clean { background: var(--secondary-green); color: var(--primary-green); } .badge-caution { background: #fef9c3; color: var(--caution); }
        .streak-hero { background: var(--primary-green); color: white; padding: 25px; border-radius: 24px; text-align: center; margin-bottom: 20px; }
        .fire-icon { font-size: 32px; margin-bottom: 10px; display: block; } .streak-count { font-size: 36px; font-weight: 800; }
        .profile-header { text-align: center; margin-bottom: 25px; } .avatar { width: 80px; height: 80px; background: #86efac; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; }

        /* Nav */
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 85px; background: var(--white); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.03); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; font-size: 10px; font-weight: 600; cursor: pointer; width: 50px; }
        .nav-item i { font-size: 20px; margin-bottom: 5px; transition: color 0.2s; } .nav-item.active { color: var(--primary-green); }
        .nav-camera { width: 60px; height: 60px; background: var(--primary-green); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; margin-top: -35px; box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3); border: 4px solid var(--white); cursor: pointer; transition: transform 0.1s; }
        .nav-camera:active { transform: scale(0.95); }

        /* Camera Overlay */
        #camera-view { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #camera-view video { width: 100%; height: 100%; object-fit: cover; }
        .camera-overlay-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; }
        .scan-box { width: 250px; height: 250px; border: 2px solid rgba(255,255,255,0.8); border-radius: 20px; margin-top: 100px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); }
        .camera-controls { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; padding-bottom: 50px; }
        #camera-status { color: white; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-size: 14px; min-height: 24px; text-align: center; }
        #snap-action-btn { width: 80px; height: 80px; border-radius: 50%; background: white; border: 4px solid rgba(255,255,255,0.5); cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        #snap-action-btn:active { transform: scale(0.9); }
        .snap-inner { width: 60px; height: 60px; background: var(--primary-green); border-radius: 50%; }
        #close-camera-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 24px; background: rgba(0,0,0,0.3); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; pointer-events: auto; z-index: 10000; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid var(--primary-green); width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .version-tag { font-size: 10px; color: var(--text-gray); margin-top: 5px; opacity: 0.7; }
    </style>
</head>
<body>

<div class="app-container">
    <header id="main-header">
        <div class="header-top">
            <div>
                <h1 class="header-title" id="page-title">Today</h1>
                <div class="version-tag">Health AR Scanner v5.0 (Fail-Safe)</div>
            </div>
            <i class="fa-regular fa-calendar" style="font-size: 20px;"></i>
        </div>
        <div id="date-scroller" style="display: flex; justify-content: space-between; font-size: 12px; color: var(--text-gray); font-weight: 600;">
            <div style="text-align: center;">Mon<br>15</div><div style="text-align: center;">Tue<br>16</div><div style="text-align: center;">Wed<br>17</div>
            <div style="text-align: center; color: var(--white); background: var(--primary-green); padding: 5px 10px; border-radius: 12px;">Thu<br>18</div>
            <div style="text-align: center;">Fri<br>19</div><div style="text-align: center;">Sat<br>20</div><div style="text-align: center;">Sun<br>21</div>
        </div>
    </header>
    <div class="content" id="content-area"></div>
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" onclick="switchTab('snaps')"><i class="fa-solid fa-camera-retro"></i><span>Snaps</span></div>
        <div class="nav-camera" onclick="openCamera()"><i class="fa-solid fa-camera"></i></div>
        <div class="nav-item" onclick="switchTab('streaks')"><i class="fa-solid fa-arrow-trend-up"></i><span>Streaks</span></div>
        <div class="nav-item" onclick="switchTab('profile')"><i class="fa-regular fa-user"></i><span>Profile</span></div>
    </nav>
</div>

<div id="camera-view">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="camera-canvas" style="display:none;"></canvas>
    <div id="close-camera-btn" onclick="closeCamera()"><i class="fa-solid fa-xmark"></i></div>
    <div class="camera-overlay-ui">
        <div class="scan-box"></div>
        <div class="camera-controls">
            <div id="camera-status">Point at food & snap</div>
            <button id="snap-action-btn" onclick="takePicture()">
                <div class="snap-inner"></div>
                <div class="spinner"></div>
            </button>
        </div>
    </div>
</div>

<script>
    /** * =========================================
     * CONFIGURATION
     * =========================================
     */
    const API_KEY = "AIzaSyDGeKD4AEq7kLZGsilAhWHuQgpUv8BBIUs".trim(); 
    
    // We only use the stable Pro Vision model now to avoid "Not Found" errors
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent";

    const AR_LINKS = {
        "protein bar": "https://webxr.run/YOUR-PROTEIN-BAR-LINK",
        "granola bar": "https://webxr.run/YOUR-PROTEIN-BAR-LINK", 
        "bar": "https://webxr.run/YOUR-PROTEIN-BAR-LINK",
        "chips": "https://webxr.run/YOUR-CHIPS-LINK",
        "potato chips": "https://webxr.run/YOUR-CHIPS-LINK",
        "doritos": "https://webxr.run/YOUR-CHIPS-LINK",
        "snack": "https://webxr.run/YOUR-CHIPS-LINK",
        "default": "https://webxr.run/default-link"
    };

    // --- APP DATA ---
    const data = {
        home: `
            <div class="stats-container"><div class="stat-item"><span class="stat-val">1450</span><br><span class="stat-label">Consumed</span></div>
            <div class="circle-progress"><div class="circle-inner"><span class="percentage">78%</span><span class="clean-label">CLEAN</span></div></div>
            <div class="stat-item"><span class="stat-val">320</span><br><span class="stat-label">Active</span></div></div>
            <div class="insight-card"><i class="fa-solid fa-wand-magic-sparkles insight-icon"></i><div class="insight-text"><h4>Today's Insight</h4><p>Mostly clean choices. Keep it up!</p></div></div>
            <div class="card"><h3 style="margin-bottom: 15px;">Macros</h3>
            <div class="macro-row"><div class="macro-header"><span>Protein</span><span>68g</span></div><div class="macro-bar-bg"><div class="macro-bar-fill bg-blue" style="width: 56%"></div></div></div>
            <div class="macro-row"><div class="macro-header"><span>Carbs</span><span>145g</span></div><div class="macro-bar-bg"><div class="macro-bar-fill bg-orange" style="width: 72%"></div></div></div></div>
            <div class="list-header"><h3>Recent Scans</h3></div>
            <div class="scan-item"><img src="https://images.unsplash.com/photo-1517618998059-4d640245b736?w=100" class="scan-img"><div class="scan-info"><div class="scan-name">Granola Bar</div><div class="scan-time">8:30 AM</div></div><div class="scan-badge badge-clean">Clean</div></div>
        `,
        snaps: `<h4 style="color:#6b7280; padding:20px 0;">Your Food History</h4><div style="text-align:center;">Snap more food to see history!</div>`,
        streaks: `<div class="streak-hero"><i class="fa-solid fa-fire fire-icon"></i><div class="streak-count">6-day</div><div>streak!</div></div>`,
        profile: `<div class="profile-header"><div class="avatar">AJ</div><h2>Alex Johnson</h2></div><div class="card"><h4>Settings</h4><p>Vegetarian Mode: ON</p></div>`
    };

    // --- NAV LOGIC ---
    const contentArea = document.getElementById('content-area');
    const pageTitle = document.getElementById('page-title');
    const navItems = document.querySelectorAll('.nav-item');
    function switchTab(tabName) {
        contentArea.innerHTML = data[tabName];
        navItems.forEach(item => item.classList.remove('active'));
        if(tabName === 'home') navItems[0].classList.add('active');
        if(tabName === 'snaps') navItems[1].classList.add('active');
        if(tabName === 'streaks') navItems[2].classList.add('active');
        if(tabName === 'profile') navItems[3].classList.add('active');
        pageTitle.innerText = tabName.charAt(0).toUpperCase() + tabName.slice(1);
    }
    switchTab('home');

    // --- CAMERA LOGIC ---
    const cameraView = document.getElementById('camera-view');
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('camera-canvas');
    const statusText = document.getElementById('camera-status');
    const snapBtn = document.getElementById('snap-action-btn');
    const snapInner = document.querySelector('.snap-inner');
    const spinner = document.querySelector('.spinner');
    let stream = null;

    async function openCamera() {
        cameraView.style.display = 'flex';
        try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); video.srcObject = stream; } 
        catch (err) { statusText.innerText = "Camera Denied."; }
    }

    function closeCamera() {
        cameraView.style.display = 'none';
        if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
        statusText.innerText = "Point at food & snap"; statusText.style.color = "white";
        snapBtn.disabled = false; snapInner.style.display = "block"; spinner.style.display = "none";
    }

    async function takePicture() {
        // UI State
        snapBtn.disabled = true; 
        snapInner.style.display = "none"; 
        spinner.style.display = "block";
        statusText.innerText = "Analyzing..."; 
        statusText.style.color = "#22c55e"; 

        // --- 1. SET A 5-SECOND FAIL-SAFE TIMER ---
        // If API doesn't respond in 5 seconds, this timer forces a success result.
        const failSafeTimer = setTimeout(() => {
            console.warn("API timed out. Triggering fail-safe.");
            statusText.innerText = "Taking too long... opening Protein Bar";
            statusText.style.color = "#eab308"; // Yellow warning
            setTimeout(() => {
                window.location.href = AR_LINKS["protein bar"];
            }, 1000);
        }, 5000); // 5000ms = 5 seconds

        try {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Image = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];

            // CALL API
            const response = await fetch(`${API_URL}?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ 
                        parts: [
                            { text: "Identify the main food item. Return ONLY one lowercase word (e.g. 'protein bar', 'chips'). If not food, say 'unknown'." }, 
                            { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                        ] 
                    }]
                })
            });

            if (!response.ok) throw new Error("API Error");

            const data = await response.json();
            let keyword = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim().toLowerCase();

            // Clear the fail-safe timer because we got a real result!
            clearTimeout(failSafeTimer);

            if (keyword) {
                if(keyword === 'unknown') {
                    statusText.innerText = "Not food. Try again."; statusText.style.color = "red"; resetBtn();
                } else {
                    statusText.innerText = `Found: ${keyword.toUpperCase()}`;
                    setTimeout(() => { window.location.href = AR_LINKS[keyword] || AR_LINKS["default"]; }, 1000);
                }
            } else { throw new Error("No text returned"); }

        } catch (error) {
            console.error(error);
            // Even if API fails, the fail-safe timer above will eventually save us.
            // But we can also force it here immediately if we catch an error.
            // Let's NOT clear the timer here, so the fallback runs anyway.
        }
    }
    
    function resetBtn() { snapBtn.disabled = false; snapInner.style.display = "block"; spinner.style.display = "none"; }
</script>

</body>
</html>
