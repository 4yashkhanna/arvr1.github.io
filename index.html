<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InsideOut Nutrition Tracker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-green: #22c55e;
            --secondary-green: #dcfce7;
            --text-dark: #1f2937;
            --text-gray: #6b7280;
            --bg-gray: #f3f4f6;
            --white: #ffffff;
            --caution: #eab308;
            --avoid: #ef4444;
            --blue: #3b82f6;
            --orange: #f97316;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

        body {
            background-color: #e5e5e5;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        .app-container {
            width: 100%; max-width: 390px; height: 100vh; max-height: 844px;
            background-color: var(--bg-gray); border-radius: 0; overflow: hidden;
            position: relative; display: flex; flex-direction: column;
        }
        @media (min-width: 400px) { .app-container { height: 844px; border-radius: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.1); } }

        header { padding: 40px 20px 10px 20px; background: var(--bg-gray); z-index: 10; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header-title { font-size: 24px; font-weight: 700; color: var(--text-dark); }
        .content { flex: 1; overflow-y: auto; padding: 0 20px 100px 20px; scrollbar-width: none; } .content::-webkit-scrollbar { display: none; }
        .card { background: var(--white); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .stats-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .stat-item { text-align: center; } .stat-val { font-size: 18px; font-weight: 700; } .stat-label { font-size: 10px; color: var(--text-gray); text-transform: uppercase; }
        .circle-progress { width: 140px; height: 140px; border-radius: 50%; background: conic-gradient(var(--primary-green) 0% 78%, #e5e7eb 78% 100%); display: flex; justify-content: center; align-items: center; position: relative; }
        .circle-inner { width: 120px; height: 120px; background: var(--bg-gray); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .percentage { font-size: 32px; font-weight: 800; color: var(--text-dark); } .clean-label { font-size: 14px; color: var(--text-gray); font-weight: 600; }
        .macro-row { margin-bottom: 12px; } .macro-header { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; font-weight: 600;}
        .macro-bar-bg { width: 100%; height: 6px; background: #e5e7eb; border-radius: 10px; overflow: hidden; } .macro-bar-fill { height: 100%; border-radius: 10px; }
        .bg-blue { background-color: var(--blue); } .bg-orange { background-color: var(--orange); } 
        
        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; height: 85px; background: var(--white); display: flex; justify-content: space-around; align-items: flex-start; padding-top: 15px; box-shadow: 0 -10px 30px rgba(0,0,0,0.03); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #9ca3af; font-size: 10px; font-weight: 600; cursor: pointer; width: 50px; }
        .nav-item i { font-size: 20px; margin-bottom: 5px; } .nav-item.active { color: var(--primary-green); }
        .nav-camera { width: 60px; height: 60px; background: var(--primary-green); border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; margin-top: -35px; box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3); border: 4px solid var(--white); cursor: pointer; transition: transform 0.1s; }

        #camera-view { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; }
        #camera-canvas { width: 100%; height: 100%; object-fit: cover; display: none; } 
        .camera-overlay-ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; }
        .scan-box { width: 250px; height: 250px; border: 2px solid rgba(255,255,255,0.8); border-radius: 20px; margin-top: 100px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.6); }
        .camera-controls { pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; padding-bottom: 50px; }
        #camera-status { color: white; background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px; font-size: 14px; text-align: center; }
        #snap-action-btn { width: 80px; height: 80px; border-radius: 50%; background: white; border: 4px solid rgba(255,255,255,0.5); cursor: pointer; display: flex; justify-content: center; align-items: center; }
        .snap-inner { width: 60px; height: 60px; background: var(--primary-green); border-radius: 50%; }
        #review-controls { display: none; flex-direction: row; gap: 40px; }
        .review-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-size: 24px; cursor: pointer; }
        .btn-retake { background: #ef4444; }
        .btn-confirm { background: #22c55e; }
        .btn-confirm.disabled { opacity: 0.5; pointer-events: none; background: #6b7280; }
        #close-camera-btn { position: absolute; top: 20px; right: 20px; color: white; font-size: 24px; background: rgba(0,0,0,0.3); width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 10000; }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top: 4px solid var(--white); width: 30px; height: 30px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .version-tag { font-size: 10px; color: var(--text-gray); margin-top: 5px; font-weight: bold;}
    </style>
</head>
<body>

<div class="app-container">
    <header id="main-header">
        <div class="header-top">
            <div>
                <h1 class="header-title" id="page-title">Today</h1>
                <div class="version-tag">Health AR v10.5 (2.5 Flash Optimized)</div>
            </div>
            <i class="fa-regular fa-calendar" style="font-size: 20px;"></i>
        </div>
    </header>
    <div class="content" id="content-area"></div>
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>Home</span></div>
        <div class="nav-item" onclick="switchTab('snaps')"><i class="fa-solid fa-camera-retro"></i><span>Snaps</span></div>
        <div class="nav-camera" onclick="openCamera()"><i class="fa-solid fa-camera"></i></div>
        <div class="nav-item" onclick="switchTab('streaks')"><i class="fa-solid fa-arrow-trend-up"></i><span>Streaks</span></div>
        <div class="nav-item" onclick="switchTab('profile')"><i class="fa-regular fa-user"></i><span>Profile</span></div>
    </nav>
</div>

<div id="camera-view">
    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="camera-canvas"></canvas>
    <div id="close-camera-btn" onclick="closeCamera()"><i class="fa-solid fa-xmark"></i></div>
    <div class="camera-overlay-ui">
        <div class="scan-box"></div>
        <div class="camera-controls">
            <div id="camera-status">Point at food & snap</div>
            <button id="snap-action-btn" onclick="snapPhoto()"><div class="snap-inner"></div></button>
            <div id="review-controls">
                <div class="review-btn btn-retake" onclick="retakePhoto()"><i class="fa-solid fa-rotate-left"></i></div>
                <div class="review-btn btn-confirm" id="confirm-btn" onclick="analyzePhoto()">
                    <i class="fa-solid fa-check" id="confirm-icon"></i>
                    <div class="spinner" id="analyze-spinner"></div>
                    <span id="countdown-text" style="font-size: 14px; display: none;"></span>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const API_KEY = "AIzaSyD3JlEXblM7_5jzrjplATXDLM6Fh6CSqK8";
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent";

    const AR_LINKS = {
        "chocolate": "https://webxr.run/k7w4YWLOonyZg",
        "cake": "https://webxr.run/zdgoWdw3Wnnwz",
        "popcorn": "https://webxr.run/og9A29XD7P403",
        "default": "https://webxr.run/default-link"
    };

    const data = {
        home: `<div class="stats-container"><div class="stat-item"><span class="stat-val">1450</span><br><span class="stat-label">Consumed</span></div><div class="circle-progress"><div class="circle-inner"><span class="percentage">78%</span><span class="clean-label">CLEAN</span></div></div><div class="stat-item"><span class="stat-val">320</span><br><span class="stat-label">Active</span></div></div><div class="card"><h3 style="margin-bottom: 15px;">Macros</h3><div class="macro-row"><div class="macro-header"><span>Protein</span><span>68g</span></div><div class="macro-bar-bg"><div class="macro-bar-fill bg-blue" style="width: 56%"></div></div></div></div>`,
        snaps: `<h4 style="color:#6b7280; padding:20px 0;">Your Food History</h4>`,
        streaks: `<div style="text-align:center; padding:50px;">6-day streak! 🔥</div>`,
        profile: `<div style="text-align:center; padding:50px;"><h2>Yash Khanna</h2><p>FLAME University</p></div>`
    };

    function switchTab(tabName) {
        document.getElementById('content-area').innerHTML = data[tabName];
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        document.getElementById('page-title').innerText = tabName.charAt(0).toUpperCase() + tabName.slice(1);
    }
    switchTab('home');

    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('camera-canvas');
    const statusText = document.getElementById('camera-status');
    const snapBtn = document.getElementById('snap-action-btn');
    const reviewControls = document.getElementById('review-controls');
    const confirmBtn = document.getElementById('confirm-btn');
    const spinner = document.getElementById('analyze-spinner');
    const confirmIcon = document.getElementById('confirm-icon');
    const countdownText = document.getElementById('countdown-text');
    let stream = null;
    let isLocked = false;

    async function openCamera() {
        document.getElementById('camera-view').style.display = 'flex';
        try { 
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } }); 
            video.srcObject = stream; 
        } catch (err) { statusText.innerText = "Camera Denied."; }
    }

    function closeCamera() {
        document.getElementById('camera-view').style.display = 'none';
        if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    }

    function snapPhoto() {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        video.style.display = 'none'; canvas.style.display = 'block';
        snapBtn.style.display = 'none'; reviewControls.style.display = 'flex';
    }

    function retakePhoto() {
        if(isLocked) return;
        video.style.display = 'block'; canvas.style.display = 'none';
        snapBtn.style.display = 'flex'; reviewControls.style.display = 'none';
    }

    async function analyzePhoto() {
        if(isLocked) return;
        confirmIcon.style.display = 'none'; spinner.style.display = 'block';
        statusText.innerText = "Scanning...";

        try {
            // Optimized: Lowered quality to 0.3 to save tokens
            const base64Image = canvas.toDataURL('image/jpeg', 0.3).split(',')[1];
            const response = await fetch(`${API_URL}?key=${API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [
                        { text: "Output ONLY one word from this list: chocolate, cake, popcorn. If none, output unknown." }, 
                        { inline_data: { mime_type: "image/jpeg", data: base64Image } }
                    ]}]
                })
            });

            if (response.status === 429) { startCooldown(30); throw new Error("Limit Hit"); }
            
            const result = await response.json();
            const keyword = result.candidates[0].content.parts[0].text.trim().toLowerCase();

            if (AR_LINKS[keyword]) {
                statusText.innerText = `Matched: ${keyword.toUpperCase()}`;
                setTimeout(() => window.location.href = AR_LINKS[keyword], 500);
            } else {
                statusText.innerText = "Not recognized. Try again.";
                setTimeout(resetUI, 2000);
            }
        } catch (e) {
            if(e.message !== "Limit Hit") { statusText.innerText = "Error. Resetting..."; setTimeout(resetUI, 2000); }
        }
    }

    function startCooldown(sec) {
        isLocked = true;
        spinner.style.display = 'none';
        countdownText.style.display = 'block';
        confirmBtn.classList.add('disabled');
        let count = sec;
        const timer = setInterval(() => {
            count--;
            countdownText.innerText = count + "s";
            statusText.innerText = "API Resting... " + count + "s";
            if(count <= 0) { clearInterval(timer); isLocked = false; resetUI(); }
        }, 1000);
    }

    function resetUI() {
        if(isLocked) return;
        video.style.display = 'block'; canvas.style.display = 'none';
        snapBtn.style.display = 'flex'; reviewControls.style.display = 'none';
        confirmIcon.style.display = 'block'; spinner.style.display = 'none';
        countdownText.style.display = 'none'; confirmBtn.classList.remove('disabled');
        statusText.innerText = "Point at food & snap";
    }
</script>
</body>
</html>
